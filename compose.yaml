services:
  db:
    image: postgres:16.15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?required} -d ${POSTGRES_DB:?required}"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    environment:
      APP_ENV: ${APP_ENV:?required}
      APP_ORIGIN: ${APP_ORIGIN:?required}
      RELEASE_SHA: ${RELEASE_SHA:?required}
      DATABASE_URL: ${DATABASE_URL:?required}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')\""]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: ${APP_ENV:?required}
      RELEASE_SHA: ${RELEASE_SHA:?required}
      DATABASE_URL: ${DATABASE_URL:?required}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    ports:
      - "127.0.0.1:5173:5173"
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
