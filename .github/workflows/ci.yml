name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache backend dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock') }}

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install uv
        run: pip install uv==0.12.10

      - name: Bootstrap dependencies
        run: python scripts/verify.py bootstrap


      - name: Verify changed behavior
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            python scripts/verify.py regression --base "$BASE_SHA" --fresh
          else
            python scripts/verify.py regression --fresh
          fi

      - name: Build API container image
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          import verify
          try:
              scope = verify.changed_scope(os.environ.get("BASE_SHA", ""))
          except RuntimeError:
              scope = "all"
          if scope == "all":
              import subprocess
              subprocess.run([sys.executable, "scripts/verify.py", "build", "--fresh"], check=True)
          PY
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-verification
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  lint:
    name: Lint and Typecheck
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require shared verification result
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = "success"

  unit:
    name: Unit Tests
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require shared verification result
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = "success"

  integration:
    name: Integration Tests
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require shared verification result
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = "success"

  concurrency:
    name: Concurrency Gate
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require shared verification result
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = "success"

  build:
    name: Build API Image
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require shared verification result
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = "success"
